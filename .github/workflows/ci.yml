name: Check-in Daily CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-frontend:
    name: Frontend Vue 3 / Nuxt Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: checkin-daily/frontend/package-lock.json

      - name: Install dependencies
        working-directory: checkin-daily/frontend
        run: npm ci

      - name: Run Unit Tests
        working-directory: checkin-daily/frontend
        run: npm test

      - name: Nuxt Production Build
        working-directory: checkin-daily/frontend
        run: npm run build

  validate-backend:
    name: Backend Go Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache-dependency-path: checkin-daily/backend/go.sum

      - name: Run Go Tests
        working-directory: checkin-daily/backend
        run: go test -v -race ./...

      - name: Build Go Server Binary
        working-directory: checkin-daily/backend
        run: go build -o server .

  validate-database:
    name: D1 Migrations Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate SQLite Migrations
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const migrationsDir = path.join('checkin-daily', 'frontend', 'migrations');
          const files = fs.readdirSync(migrationsDir).filter(f => f.endsWith('.sql')).sort();
          console.log('Validating ' + files.length + ' migration files...');
          for (const file of files) {
            const p = path.join(migrationsDir, file);
            const sql = fs.readFileSync(p, 'utf8');
            if (!sql.trim()) throw new Error('Empty migration: ' + file);
            console.log('✓ ' + file + ' (' + sql.length + ' bytes)');
          }
          console.log('All migrations syntax & file integrity verified successfully.');
          "
