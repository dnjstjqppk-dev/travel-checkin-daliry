name: Check-in Daily CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  validate-frontend:
    name: Frontend Vue 3 / Nuxt Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: checkin-daily/frontend/package-lock.json

      - name: Install dependencies
        working-directory: checkin-daily/frontend
        run: npm ci

      - name: Nuxt Production Build
        working-directory: checkin-daily/frontend
        run: npm run build

  validate-backend:
    name: Backend Go Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache-dependency-path: checkin-daily/backend/go.sum

      - name: Run Go Tests
        working-directory: checkin-daily/backend
        run: go test -v -race ./...

      - name: Build Go Server Binary
        working-directory: checkin-daily/backend
        run: go build -o server .

  validate-database:
    name: D1 Migrations Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate SQL Syntax
        run: |
          for file in checkin-daily/frontend/migrations/*.sql; do
            echo "Checking $file..."
            test -s "$file" || exit 1
          done
          echo "All migrations verified."

