services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    volumes:
      - checkin-data:/data
    environment:
      PORT: 8080
      SQLITE_PATH: /data/checkin-daily.db
      ADMIN_USERNAME: ${ADMIN_USERNAME:?set ADMIN_USERNAME in .env}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?set ADMIN_PASSWORD_HASH in .env}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      API_INTERNAL_BASE: http://backend:8080
      NUXT_API_INTERNAL_BASE: http://backend:8080
    depends_on:
      - backend

volumes:
  checkin-data: