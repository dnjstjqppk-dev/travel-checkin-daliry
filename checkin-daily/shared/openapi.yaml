openapi: 3.1.0
info:
  title: Check-in Daily API
  version: 0.1.0
  description: Public travel journalism API and authenticated admin CMS endpoints. All /api/admin/* routes require the admin session cookie.
servers:
  - url: http://localhost:8080
tags:
  - name: Public
  - name: Admin
paths:
  /health:
    get:
      tags: [Public]
      summary: Health check
      responses:
        '200':
          description: Service is healthy
  /api/auth/login:
    post:
      tags: [Admin]
      summary: Authenticate the configured admin and set a short-lived session cookie
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminLoginInput' }
      responses:
        '200':
          description: Admin session established
          headers:
            Set-Cookie:
              schema: { type: string }
              description: HttpOnly, SameSite=Strict session cookie; Secure in production.
        '400': { description: Invalid login request }
        '401': { description: Invalid credentials }
        '403': { description: Origin is not allowed }
        '429': { description: Login rate limit exceeded }
  /api/auth/session:
    get:
      tags: [Admin]
      summary: Return the current authenticated admin session
      responses:
        '200': { description: Current admin identity and role }
        '401': { description: Session is missing or expired }
  /api/auth/logout:
    post:
      tags: [Admin]
      summary: End the current admin session
      responses:
        '204': { description: Session cookie cleared }
        '401': { description: Session is missing or expired }
        '403': { description: Origin is not allowed }
  /api/categories:
    get:
      tags: [Public]
      summary: List article categories
      responses:
        '200':
          description: Available categories
  /api/admin/categories:
    get:
      tags: [Admin]
      summary: List article categories
      responses:
        '200': { description: Category list }
    post:
      tags: [Admin]
      summary: Create a category
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryInput' }
      responses:
        '201': { description: Category created }
        '409': { description: Slug already exists }
  /api/admin/categories/{id}:
    put:
      tags: [Admin]
      summary: Update a category
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryInput' }
      responses:
        '200': { description: Category updated }
        '404': { description: Category not found }
    delete:
      tags: [Admin]
      summary: Delete an unused category
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '204': { description: Category deleted }
        '404': { description: Category not found }
        '409': { description: Category is assigned to articles }
  /api/countries:
    get:
      tags: [Public]
      summary: List countries for travel news filters
      responses:
        '200': { description: Countries ordered for display }
  /api/countries/{code}/cities:
    get:
      tags: [Public]
      summary: List cities belonging to a country
      parameters:
        - in: path
          name: code
          required: true
          schema: { type: string, minLength: 2, maxLength: 2 }
      responses:
        '200': { description: Cities within the country }
        '404': { description: Country not found }
  /api/admin/countries:
    get:
      tags: [Admin]
      summary: List managed countries
      responses:
        '200': { description: Country list }
    post:
      tags: [Admin]
      summary: Create a country
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CountryInput' }
      responses:
        '201': { description: Country created }
        '409': { description: Country code already exists }
  /api/admin/countries/{code}:
    put:
      tags: [Admin]
      summary: Update a country
      parameters:
        - in: path
          name: code
          required: true
          schema: { type: string, minLength: 2, maxLength: 2 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CountryInput' }
      responses:
        '200': { description: Country updated }
        '400': { description: Country code is immutable }
        '404': { description: Country not found }
    delete:
      tags: [Admin]
      summary: Delete a country, its cities, and article location tags
      parameters:
        - in: path
          name: code
          required: true
          schema: { type: string, minLength: 2, maxLength: 2 }
      responses:
        '204': { description: Country deleted }
        '404': { description: Country not found }
  /api/admin/countries/{code}/cities:
    get:
      tags: [Admin]
      summary: List managed cities in a country
      parameters:
        - in: path
          name: code
          required: true
          schema: { type: string }
      responses:
        '200': { description: Cities in the selected country }
        '404': { description: Country not found }
    post:
      tags: [Admin]
      summary: Create a city in a country
      parameters:
        - in: path
          name: code
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CityInput' }
      responses:
        '201': { description: City created }
        '404': { description: Country not found }
  /api/admin/cities/{id}:
    put:
      tags: [Admin]
      summary: Update a city name
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CityInput' }
      responses:
        '200': { description: City updated }
        '404': { description: City not found }
    delete:
      tags: [Admin]
      summary: Delete a city and its article location tags
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '204': { description: City deleted }
        '404': { description: City not found }
  /api/articles:
    get:
      tags: [Public]
      summary: List published articles
      parameters:
        - in: query
          name: category
          description: Category slug; realtime returns all latest published news
          schema: { type: string }
        - in: query
          name: country
          description: ISO alpha-2 country code for location filtering
          schema: { type: string, minLength: 2, maxLength: 2 }
        - in: query
          name: city
          description: City id for location filtering
          schema: { type: string }
        - in: query
          name: q
          description: Search article titles and summaries
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Published articles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Article' }
  /api/articles/{slug}:
    get:
      tags: [Public]
      summary: Read a published article
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Article found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Article' }
        '404': { description: Article not found }
  /api/articles/id/{id}:
    get:
      tags: [Public]
      summary: Read a published article by numeric id
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
        - in: query
          name: category
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Article found with location tags
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Article' }
        '404': { description: Article not found }
  /api/admin/articles:
    get:
      tags: [Admin]
      summary: List all articles including drafts
      responses:
        '200': { description: All articles }
    post:
      tags: [Admin]
      summary: Create an article
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArticleInput' }
      responses:
        '201': { description: Article created }
        '400': { description: Invalid input }
  /api/admin/articles/{id}:
    put:
      tags: [Admin]
      summary: Update an article
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArticleInput' }
      responses:
        '200': { description: Article updated }
        '404': { description: Article not found }
    delete:
      tags: [Admin]
      summary: Delete an article
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '204': { description: Article deleted }
        '404': { description: Article not found }
  /api/ads:
    get:
      tags: [Public]
      summary: List active AdSense placements
      responses:
        '200': { description: Active advertising placements }
  /api/admin/ads:
    get:
      tags: [Admin]
      summary: List all advertising placements
      responses:
        '200': { description: All advertising placements }
    post:
      tags: [Admin]
      summary: Create an advertising placement
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdPlacementInput' }
      responses:
        '201': { description: Placement created }
        '400': { description: Invalid AdSense configuration }
        '409': { description: Placement id already exists }
  /api/admin/ads/{id}:
    put:
      tags: [Admin]
      summary: Update a placement and enable or disable it
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdPlacementInput' }
      responses:
        '200': { description: Placement updated }
        '400': { description: Invalid AdSense configuration }
        '404': { description: Placement not found }
    delete:
      tags: [Admin]
      summary: Delete an advertising placement
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '204': { description: Placement deleted }
        '404': { description: Placement not found }
components:
  securitySchemes:
    AdminSessionCookie:
      type: apiKey
      in: cookie
      name: checkin_admin_session
  schemas:
    AdminLoginInput:
      type: object
      required: [username, password]
      properties:
        username: { type: string, maxLength: 254 }
        password: { type: string, maxLength: 1024, format: password }
    ArticleInput:
      allOf:
        - $ref: '#/components/schemas/ArticleFields'
        - type: object
          properties:
            cityIds:
              type: array
              items: { type: string }
    Article:
      allOf:
        - $ref: '#/components/schemas/ArticleFields'
        - type: object
          properties:
            id: { type: integer }
            publishedAt: { type: [string, 'null'], format: date-time }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
            cities:
              type: array
              items: { $ref: '#/components/schemas/City' }
    ArticleFields:
      type: object
      required: [title, slug, category, status]
      properties:
        title: { type: string, maxLength: 180 }
        slug: { type: string, maxLength: 200 }
        summary: { type: string, maxLength: 500 }
        content: { type: string, description: Markdown source }
        category: { type: string, description: Category slug from /api/categories }
        author: { type: string }
        coverImage: { type: string }
        status: { type: string, enum: [draft, published] }
    CategoryInput:
      type: object
      required: [name, slug]
      properties:
        name: { type: string, maxLength: 60 }
        slug: { type: string, maxLength: 60 }
    CountryInput:
      type: object
      required: [code, nameKo, nameEn]
      properties:
        code: { type: string, minLength: 2, maxLength: 2 }
        nameKo: { type: string, maxLength: 100 }
        nameEn: { type: string, maxLength: 100 }
        continent: { type: string, maxLength: 50 }
        sortOrder: { type: integer }
    Country:
      allOf:
        - $ref: '#/components/schemas/CountryInput'
        - type: object
          properties:
            createdAt: { type: string, format: date-time }
    CityInput:
      type: object
      required: [id, nameKo, nameEn]
      properties:
        id: { type: string, maxLength: 50 }
        nameKo: { type: string, maxLength: 100 }
        nameEn: { type: string, maxLength: 100 }
    City:
      allOf:
        - $ref: '#/components/schemas/CityInput'
        - type: object
          properties:
            countryCode: { type: string, minLength: 2, maxLength: 2 }
            country: { $ref: '#/components/schemas/Country' }
    AdPlacementInput:
      type: object
      required: [id, name]
      properties:
        id: { type: string, maxLength: 50 }
        name: { type: string, maxLength: 100 }
        adClientId: { type: string, maxLength: 100 }
        adSlotId: { type: string, maxLength: 100 }
        format: { type: string, default: auto }
        isActive: { type: boolean, default: false }