<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 76" fill="none">
  <!-- Hybrid mark: pine tile + serif C -->
  <g id="brand-emblem">
    <rect x="2" y="2" width="72" height="72" rx="16" fill="#0E6B4F"/>
    <text x="37" y="53" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="700" fill="#FFFFFF" text-anchor="middle">C</text>
  </g>

  <!-- Wordmark: CHECK-IN DAILY -->
  <g id="brand-text">
    <text x="92" y="44" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="900" fill="#101613" letter-spacing="-0.5">CHECK-IN</text>
    <text x="278" y="44" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="900" fill="#0E6B4F" letter-spacing="-0.5">DAILY</text>
    <text x="94" y="63" font-family="'Courier New', Courier, monospace" font-size="9.5" font-weight="700" fill="#6B7570" letter-spacing="2">GLOBAL TRAVEL INTELLIGENCE</text>
  </g>
</svg>
