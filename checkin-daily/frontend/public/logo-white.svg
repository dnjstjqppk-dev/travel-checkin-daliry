<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 76" fill="none">
  <!-- Hybrid mark for dark surfaces -->
  <g id="brand-emblem">
    <rect x="2" y="2" width="72" height="72" rx="16" fill="#35B184"/>
    <text x="37" y="53" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="700" fill="#0B1512" text-anchor="middle">C</text>
  </g>

  <!-- Wordmark: CHECK-IN DAILY (dark-surface mode) -->
  <g id="brand-text">
    <text x="92" y="44" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">CHECK-IN</text>
    <text x="278" y="44" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="900" fill="#35B184" letter-spacing="-0.5">DAILY</text>
    <text x="94" y="63" font-family="'Courier New', Courier, monospace" font-size="9.5" font-weight="700" fill="#8B948F" letter-spacing="2">GLOBAL TRAVEL INTELLIGENCE</text>
  </g>
</svg>
