<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Paper background with hairline frame -->
  <rect width="1200" height="630" fill="#FFFFFF"/>
  <rect x="24" y="24" width="1152" height="582" fill="none" stroke="#E3E8E2" stroke-width="2"/>

  <!-- Overline -->
  <text x="80" y="140" fill="#0E6B4F" font-family="'Courier New', Courier, monospace" font-size="20" font-weight="700" letter-spacing="4">
    INDEPENDENT GLOBAL TRAVEL JOURNALISM
  </text>

  <!-- Brand Heading -->
  <text x="80" y="245" fill="#101613" font-family="Georgia, 'Times New Roman', serif" font-size="88" font-weight="900" letter-spacing="-1">
    CHECK-IN <tspan fill="#0E6B4F">DAILY</tspan>
  </text>

  <!-- Subtitle -->
  <text x="80" y="325" fill="#3D4742" font-family="Georgia, serif" font-size="32" font-style="italic" font-weight="400">
    The World’s Window on Travel Intelligence &amp; Market Trends
  </text>

  <!-- Tagline Korean -->
  <text x="80" y="380" fill="#6B7570" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="400">
    전 세계 항공, 호텔, 여행지 트렌드를 데이터 기반으로 심층 보도하는 디지털 뉴스룸
  </text>

  <!-- Category Badges -->
  <g transform="translate(80, 470)" font-family="'Courier New', Courier, monospace" font-size="14" font-weight="700">
    <rect x="0" y="0" width="170" height="46" rx="23" fill="#0E6B4F"/>
    <text x="85" y="30" fill="#FFFFFF" text-anchor="middle">AVIATION</text>

    <rect x="186" y="0" width="150" height="46" rx="23" fill="none" stroke="#C9D2C7" stroke-width="1.5"/>
    <text x="261" y="30" fill="#3D4742" text-anchor="middle">HOTELS</text>

    <rect x="352" y="0" width="200" height="46" rx="23" fill="none" stroke="#C9D2C7" stroke-width="1.5"/>
    <text x="452" y="30" fill="#3D4742" text-anchor="middle">DESTINATIONS</text>

    <rect x="568" y="0" width="180" height="46" rx="23" fill="none" stroke="#C9D2C7" stroke-width="1.5"/>
    <text x="658" y="30" fill="#3D4742" text-anchor="middle">TOP STORIES</text>
  </g>

  <!-- Footer Legal / Domain -->
  <line x1="80" y1="560" x2="1120" y2="560" stroke="#E3E8E2" stroke-width="1"/>
  <text x="80" y="592" fill="#8B948F" font-family="'Courier New', Courier, monospace" font-size="14">
    checkindaily.com · Verified Travel Newsroom
  </text>
</svg>
